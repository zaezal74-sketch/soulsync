<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<title>SoulSync · 412×915 capture</title>
<style>
  html, body { margin: 0; padding: 0; background: #ffffff; font: 12px/1.4 sans-serif; }
  .row { display: flex; gap: 10px; padding: 8px; align-items: flex-start; }
  .col { width: 412px; }
  .cap { height: 18px; color: #444; }
  iframe { display: block; width: 412px; height: 915px; border: 0; }
</style>
</head>
<body>
  <div class="row">
    <div class="col">
      <div class="cap">live</div>
      <iframe data-live="1" src="/" title="live"></iframe>
    </div>
    <div class="col">
      <div class="cap">morning</div>
      <iframe data-slot="morning" src="/" title="morning"></iframe>
    </div>
    <div class="col">
      <div class="cap">day</div>
      <iframe data-slot="day" src="/" title="day"></iframe>
    </div>
    <div class="col">
      <div class="cap">evening</div>
      <iframe data-slot="evening" src="/" title="evening"></iframe>
    </div>
  </div>
  <script>
    // Test harness only. Each frame is pinned to one time-of-day plate so all
    // of them can be captured at once, whatever the clock says; the "live"
    // frame is left alone. ?night=1 puts every frame in focus mode, to check
    // the dark face of the new bright plate.
    var night = /(?:^|[?&])night=1(?:&|$)/.test(location.search);
    document.querySelectorAll('iframe').forEach(function (f) {
      f.addEventListener('load', function () {
        var doc = f.contentDocument;
        if (!doc || !doc.body) return;
        if (f.dataset.slot) doc.body.setAttribute('data-hero', f.dataset.slot);
        if (night) {
          var frameEl = doc.querySelector('.phone-frame');
          if (frameEl) frameEl.classList.add('focus-mode');
        }
      });
    });
  </script>
</body>
</html>
