<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>SoulSync · mobile render</title>
<style>
  html, body { margin: 0; padding: 0; background: #ece3fb; }
  iframe { position: absolute; top: 0; left: 0; height: 844px; border: 0; display: block; background: #ece3fb; }
</style>
</head>
<body>
<iframe id="f" src="./index.html" title="SoulSync mobile render"></iframe>
<script>
  var q = new URLSearchParams(location.search);
  var f = document.getElementById("f");
  f.style.width = (q.get("w") || "390") + "px";
  f.addEventListener("load", function () {
    var w = f.contentWindow;
    if (q.get("tab")) w.SoulSync.switchTab(q.get("tab"));
    if (q.get("focus") === "1") {
      var frame = w.document.querySelector(".phone-frame");
      if (frame) frame.classList.add("focus-mode");
    }
  });
</script>
</body>
</html>
